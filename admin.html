<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理ページ</title>
<style>
body{font-family:sans-serif;padding:20px;}
.row{
  display:flex;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #ddd;
}
label{
  flex:1;
  font-size:18px;
}
</style>
</head>
<body>

<h2>管理ページ</h2>
<div id="list"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbx0ntU_GSqSeEyrDWz0ycADO0_GnV5ynBzKidDEoBexKETndVAh2VmFh_bG_U7pS3EL/exec";
const id=new URLSearchParams(location.search).get("id");

function load(){

 fetch(API+"?mode=getStatus&id="+id)
 .then(r=>r.json())
 .then(res=>{

   let html="";

   for(let i=1;i<=9;i++){

     const text = res.items[i] ? res.items[i][1] : "";
     const checked = res.status[i] ? "checked" : "";

     html+=`
     <div class="row">
       <input type="checkbox" ${checked}
         onchange="toggle(${i})">
       <label>${text}</label>
     </div>`;
   }

   document.getElementById("list").innerHTML=html;
 });
}

function toggle(no){

 fetch(API,{
   method:"POST",
   body:new URLSearchParams({
     mode:"update",
     id:id,
     no:no
   })
 }).then(()=>load());
}

load();
</script>

</body>
</html>
