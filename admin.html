<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理ページ</title>
<style>
body{
  font-family:sans-serif;
  padding:20px;
  text-align:center;
}

select{
  padding:8px;
  font-size:16px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.cell{
  padding:20px;
  border:1px solid #ccc;
  cursor:pointer;
  user-select:none;
}

.done{
  background:orange;
  color:white;
}

#bingo{
  margin-top:15px;
  font-size:20px;
  color:red;
}
</style>
</head>
<body>

<h2>管理ページ</h2>

<select id="userSelect" onchange="loadStatus()">
  <option value="">参加者を選択</option>
</select>

<div class="grid" id="grid"></div>
<div id="bingo"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbx0ntU_GSqSeEyrDWz0ycADO0_GnV5ynBzKidDEoBexKETndVAh2VmFh_bG_U7pS3EL/exec";

let currentId=null;
let currentStatus={};
let items=[];

/* 参加者取得 */
function loadUsers(){
 fetch(API+"?mode=getUsers")
 .then(r=>r.json())
 .then(users=>{
   const select=document.getElementById("userSelect");
   for(let i=1;i<users.length;i++){
     const opt=document.createElement("option");
     opt.value=users[i][0];
     opt.textContent=users[i][1];
     select.appendChild(opt);
   }
 });
}

/* 状態取得 */
function loadStatus(){

 const id=document.getElementById("userSelect").value;
 if(!id) return;

 currentId=id;

 fetch(API+"?mode=getStatus&id="+id)
 .then(r=>r.json())
 .then(res=>{
   currentStatus=res.status;
   items=res.items;
   draw(res.bingo);
 });
}

/* 描画 */
function draw(bingo){

 let html="";

 for(let i=1;i<=9;i++){

   const text=items[i]?items[i][1]:"";
   const done=currentStatus[i]?"done":"";

   html+=`
   <div class="cell ${done}" onclick="toggle(${i})" id="cell${i}">
     ${text}
   </div>`;
 }

 document.getElementById("grid").innerHTML=html;
 document.getElementById("bingo").innerHTML=
   bingo>0 ? "🎉 "+bingo+" BINGO" : "";
}

/* タップ処理（超高速版） */
function toggle(no){

 // 即時UI切替
 currentStatus[no]=!currentStatus[no];
 document.getElementById("cell"+no)
   .classList.toggle("done");

 // GASへ1回だけ送信（再取得なし）
 fetch(API,{
   method:"POST",
   body:new URLSearchParams({
     mode:"update",
     id:currentId,
     no:no
   })
 })
 .then(r=>r.json())
 .then(res=>{
   document.getElementById("bingo").innerHTML=
     res.bingo>0 ? "🎉 "+res.bingo+" BINGO" : "";
 });
}

loadUsers();
</script>

</body>
</html>
