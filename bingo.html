<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビンゴ</title>
<style>
body{text-align:center;font-family:sans-serif;}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin:15px;
}
.cell{
  padding:20px;
  border:1px solid #ccc;
}
.done{
  background:orange;
  color:white;
}
#result{
  font-size:22px;
  color:red;
  margin:10px;
}
#username{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}
button{
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>
<body>

<h2>ビンゴカード</h2>

<div id="result"></div>
<div class="grid" id="grid"></div>

<button onclick="load()">更新</button>

<div id="username"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbx0ntU_GSqSeEyrDWz0ycADO0_GnV5ynBzKidDEoBexKETndVAh2VmFh_bG_U7pS3EL/exec";
const id=new URLSearchParams(location.search).get("id");

function load(){

 fetch(API+"?mode=getStatus&id="+id)
 .then(r=>r.json())
 .then(res=>{

   if(res.error) return;

   let html="";

   for(let i=1;i<=9;i++){

     const text = res.items[i] ? res.items[i][1] : "";
     const done = res.status[i] ? "done" : "";

     html+=`
     <div class="cell ${done}">
       ${text}
     </div>`;
   }

   document.getElementById("grid").innerHTML=html;

   document.getElementById("result").innerHTML =
     res.bingo>0 ? "🎉 "+res.bingo+" BINGO！" : "";

   loadUserName(); // ← 追加
 });
}

/* 名前取得 */
function loadUserName(){

 fetch(API+"?mode=getUsers")
 .then(r=>r.json())
 .then(users=>{

   for(let i=1;i<users.length;i++){
     if(users[i][0] === id){
       document.getElementById("username").innerHTML =
         "参加者：" + users[i][1];
       break;
     }
   }
 });
}

load();
</script>

</body>
</html>
