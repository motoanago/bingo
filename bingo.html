<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ビンゴ</title>
<style>
body{text-align:center;font-family:sans-serif;}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin:15px;
}
.cell{
  padding:20px;
  border:1px solid #ccc;
}
.done{
  background:orange;
  color:white;
}
#result{
  font-size:22px;
  color:red;
  margin:10px;
}
#username{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}
button{
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>
<body>

<h2>ビンゴカード</h2>

<div id="result"></div>
<div class="grid" id="grid"></div>

<button onclick="load()">更新</button>

<div id="username"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbw4x60gkyKeZoNIzHPURpDzSf330S5ZhRchAr1jOvlIrWLeqHQ8vRa08iPH_ARNS3Oh/exec";
const id=new URLSearchParams(location.search).get("id");

function load(){

 fetch(API+"?mode=getStatus&id="+id)
 .then(r=>r.json())
 .then(res=>{

   if(res.error) return;

   document.getElementById("username").innerHTML="参加者："+res.name;

   let html="";

   for(let i=1;i<=9;i++){
     const text=res.items[i-1]?res.items[i-1][1]:"";
     const done=res.status[i]?"done":"";
     html+=`<div class="cell ${done}">${text}</div>`;
   }

   document.getElementById("grid").innerHTML=html;

   document.getElementById("result").innerHTML=
     res.bingo>0 ? "🎉 "+res.bingo+" BINGO！" : "";
 });
}

load();
</script>

</body>
</html>
